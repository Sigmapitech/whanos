jenkins:
  systemMessage: "🚀 Welcome to Whanos Jenkins!"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: "admin"
          password: "${ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - file: /usr/share/jenkins/ref/init.groovy.d/job_dsl.groovy

appearance:
  themeManager:
    disableUserThemes: true
    theme: "catppuccinMocha"

unclassified:
  location:
    url: http://localhost:8080/

security:
  scriptApproval:
    approvedScriptHashes:
      - "SHA512:737ba7135abbb4941c336b223d06a89ebb33379caac0169c10e97e5901337279c3eb8baa69c6ccc652f58e9e6cbc448c43236a15bcc792c535f350bd979585c3"
    forceSandbox: false
