services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Ensure Jenkins runs as uid/gid 1000
      - JENKINS_UID=1000
      - JENKINS_GID=1000
    user: "1000:1000"        # run Jenkins as non-root inside container
    restart: unless-stopped
